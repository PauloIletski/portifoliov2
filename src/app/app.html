@if (!isAdmin() && !maintenance.loading() && !activeMaintenance()) {
  <app-header />
}
<main id="main-content" tabindex="-1">
  @if (!isAdmin() && maintenance.loading()) {
    <div class="maintenance-loading">
      <app-content-status [loading]="true" [english]="english" />
    </div>
  } @else if (!isAdmin() && activeMaintenance(); as content) {
    <app-maintenance [content]="content" />
  } @else {
    <div class="route-page" appRouteSlide>
      <router-outlet />
    </div>
  }
</main>
@if (!isAdmin() && !maintenance.loading() && !activeMaintenance()) {
  <app-footer />
}
